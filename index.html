<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css?v100">
    <script type="module" src="index.js"></script>
    <title>Crapette</title>
</head>
<body>
<main>
    <section id="game">
        <div class="connection">
            <div id="dot"></div>
            <div id="player_ws_status" data-connected="false"></div>
            <input type="text" id="input_room_id" placeholder="Room ID" maxlength="4"/>
            <button id="join_room" disabled>Join room</button>
            <button id="create_room">New Room</button>
            <button id="start_sp" hidden="hidden">Start SP</button>
            <button id="get_snap">Fix Game</button>
        </div>
        <div id="opponent" class="row_1 player_cards">
            <div id="o_reserve_area" class="card_area">
                <span class="cards_left"></span>
                <div id="opponent_reserve" class="card reserve_card card-up"></div>
            </div>
            <div id="o_pile_area" class="card_area">
                <span class="cards_left"></span>
                <div id="opponent_pile" class="card main_card_one card-up"></div>
            </div>
            <div id="o_deck_area" class="card_area">
                <span class="cards_left"></span>
                <div id="opponent_deck" class="card main_deck_one card-down"></div>
            </div>
        </div>
        <div id="game_field" class="row_2">
            <div class="game_field_rows">
                <div class="game_field_row">
                    <div id="pile_l_one" class="pile pile_left"></div>
                    <div id="stack_l_one" class="stack stack_left"></div>
                    <div id="stack_r_one" class="stack stack_right"></div>
                    <div id="pile_r_one" class="pile pile_right"></div>
                </div>
                <div class="game_field_row">
                    <div id="pile_l_two" class="pile pile_left"></div>
                    <div id="stack_l_two" class="stack stack_left"></div>
                    <div id="stack_r_two" class="stack stack_right"></div>
                    <div id="pile_r_two" class="pile pile_right"></div>
                </div>
                <div class="game_field_row">
                    <div id="pile_l_three" class="pile pile_left"></div>
                    <div id="stack_l_three" class="stack stack_left"></div>
                    <div id="stack_r_three" class="stack stack_right"></div>
                    <div id="pile_r_three" class="pile pile_right"></div>
                </div>
                <div class="game_field_row">
                    <div id="pile_l_four" class="pile pile_left"></div>
                    <div id="stack_l_four" class="stack stack_left"></div>
                    <div id="stack_r_four" class="stack stack_right"></div>
                    <div id="pile_r_four" class="pile pile_right"></div>
                </div>
            </div>
        </div>
        <div id="player" class="row_3 player_cards">
            <div id="indicator_box">
                <div id="indicator_turn" class=""></div>
            </div>
            <div id="p_reserve_area" class="card_area">
                <div id="player_reserve" class="card reserve_card card-up"></div>
                <span class="cards_left"></span>
            </div>
            <div id="p_pile_area" class="card_area">
                <div id="player_pile" class="card main_card_one card-up"></div>
                <span class="cards_left"></span>
            </div>
            <div id="p_deck_area" class="card_area">
                <div id="player_deck" class="card main_deck_one card-down"></div>
                <span class="cards_left"></span>
            </div>
            <button id="end_turn">Next Turn</button>
        </div>
    </section>
</main>
</body>
</html>
